<!DOCTYPE html>
<html>
<head>
    <title>Update User Form</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
        .address-box {
            border: 1px solid #ccc;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            position: relative;
        }
        .address-box input { display: block; margin-bottom: 6px; width: 100%; box-sizing: border-box; }
        .btn-remove {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 3px;
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .btn-add { margin-bottom: 10px; padding: 6px 14px; cursor: pointer; }
        .btn-submit { padding: 8px 20px; background: #2ecc71; color: white; border: none; cursor: pointer; border-radius: 4px; }
        #response { margin-top: 20px; background: #f4f4f4; padding: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>

<h2>Update User</h2>

<div>
    <label>User ID: </label>
    <input id="userId" type="text" placeholder="User ID" style="width:300px">
</div>
<br>

<form id="updateForm" enctype="multipart/form-data">

    <input type="text"     name="Username"    placeholder="Username"><br><br>
    <input type="password" name="Password"    placeholder="Password (kosongkan jika tidak diubah)"><br><br>
    <input type="email"    name="Email"       placeholder="Email"><br><br>
    <input type="text"     name="PhoneNumber" placeholder="Phone"><br><br>
    <input type="text"     name="Gender"      placeholder="Gender"><br><br>
    <input type="file"     name="ProfileImage"><br><br>

    <hr>
    <h3>Addresses</h3>
    <div id="addressContainer"></div>

    <button type="button" class="btn-add" onclick="addAddress()">+ Tambah Address</button>
    <br><br>
    <button type="submit" class="btn-submit">Simpan</button>
</form>

<div id="response"></div>

<script>
    let addressIndex = 0;

    // Tambah address baru (tanpa Id)
    function addAddress(id = '', province = '', city = '', district = '', zipCode = '', street = '') {
        const container = document.getElementById('addressContainer');
        const idx = addressIndex++;

        const box = document.createElement('div');
        box.className = 'address-box';
        box.innerHTML = `
            ${id ? `<input type="hidden" name="Addresses[${idx}].Id" value="${id}">` : ''}
            <button type="button" class="btn-remove" onclick="this.parentElement.remove()">Hapus</button>
            <input name="Addresses[${idx}].Province" placeholder="Province" value="${province}">
            <input name="Addresses[${idx}].City"     placeholder="City"     value="${city}">
            <input name="Addresses[${idx}].District" placeholder="District" value="${district}">
            <input name="Addresses[${idx}].ZipCode"  placeholder="ZipCode"  value="${zipCode}">
            <input name="Addresses[${idx}].Street"   placeholder="Street"   value="${street}">
        `;
        container.appendChild(box);
    }

    document.getElementById('updateForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const userId = document.getElementById('userId').value.trim();
        if (!userId) {
            alert('User ID wajib diisi');
            return;
        }

        const formData = new FormData(this);

        const res = await fetch(`http://localhost:5197/api/User/${userId}`, {
            method: 'PUT',
            body: formData
        });

        const data = await res.json();
        document.getElementById('response').textContent = JSON.stringify(data, null, 2);
    });
</script>

</body>
</html>
