<!DOCTYPE html>
<html>
<head>
    <title>Update User Form</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }

        .address-box {
            border: 1px solid #ccc;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            position: relative;
        }

        .address-box input {
            display: block;
            margin-bottom: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-remove {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 3px;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .btn-add {
            margin-bottom: 10px;
            padding: 6px 14px;
            cursor: pointer;
        }

        .btn-submit {
            padding: 8px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        #response {
            margin-top: 20px;
            background: #f4f4f4;
            padding: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>Update User</h2>

<div>
    <label>User ID: </label>
    <input id="userId" type="text" placeholder="User ID" style="width:300px">
    <button type="button" onclick="getUser()">Load User</button>
</div>

<br>

<form id="updateForm" enctype="multipart/form-data">

    <input type="text" name="username" placeholder="Username"><br><br>
    <input type="password" name="password" placeholder="Password (kosongkan jika tidak diubah)"><br><br>
    <input type="email" name="email" placeholder="Email"><br><br>
    <input type="text" name="phone_number" placeholder="Phone"><br><br>
    <input type="text" name="gender" placeholder="Gender"><br><br>

    <input type="file" name="image"><br><br>

    <hr>
    <h3>Addresses</h3>

    <div id="addressContainer"></div>

    <button type="button" class="btn-add" onclick="addAddress()">
        + Tambah Address
    </button>

    <br><br>

    <button type="submit" class="btn-submit">Simpan</button>
</form>

<pre id="response"></pre>

<script>
    let addressIndex = 0;
    
    /* =========================
       GET USER BY ID
    ========================= */
  async function getUser() {
    const userId = document.getElementById('userId').value.trim();

    if (!userId) {
        alert('User ID wajib diisi');
        return;
    }

    const res = await fetch(`http://localhost:5197/api/User/${userId}`);

    if (!res.ok) {
        alert('User tidak ditemukan');
        return;
    }

    const response = await res.json();

    // 🔥 INI FIX UTAMA
    const user = response.data;

    console.log("USER:", user);

    // fill form
    document.querySelector('[name="username"]').value = user.username ?? '';
    document.querySelector('[name="email"]').value = user.email ?? '';
    document.querySelector('[name="phone_number"]').value = user.phoneNumber ?? '';
    document.querySelector('[name="gender"]').value = user.gender ?? '';

    // reset addresses
    document.getElementById('addressContainer').innerHTML = '';
    addressIndex = 0;

    // addresses kosong di response kamu, jadi ini aman
    if (user.addresses && user.addresses.length > 0) {
        user.addresses.forEach(a => {
            addAddress(a.id, a.villageId, a.street);
        });
    }
}
    /* =========================
       ADD ADDRESS
    ========================= */
    function addAddress(id = '', village_id = '', street = '') {
        const container = document.getElementById('addressContainer');
        const idx = addressIndex++;
    
        const box = document.createElement('div');
        box.className = 'address-box';
    
        box.innerHTML = `
            ${id ? `<input type="hidden" name="addresses[${idx}].Id" value="${id}">` : ''}

            <button type="button" class="btn-remove" onclick="this.parentElement.remove()">
                Hapus
            </button>

            <input name="addresses[${idx}].village_id"
                   placeholder="Village ID"
                   value="${village_id}">

            <input name="addresses[${idx}].Street"
                   placeholder="Street"
                   value="${street}">
        `;
    
        container.appendChild(box);
    }
    
    /* =========================
       SUBMIT UPDATE
    ========================= */
    document.getElementById('updateForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const userId = document.getElementById('userId').value.trim();

        if (!userId) {
            alert('User ID wajib diisi');
            return;
        }

        // Re-index address fields agar selalu mulai dari 0
        document.querySelectorAll('.address-box').forEach((box, newIdx) => {
            box.querySelectorAll('input').forEach(input => {
                input.name = input.name.replace(/addresses\[\d+\]/i, `addresses[${newIdx}]`);
            });
        });

        const formData = new FormData(this);
    
        const res = await fetch(`http://localhost:5197/api/User/${userId}`, {
            method: 'PUT',
            body: formData
        });
    
        const data = await res.json();
    
        document.getElementById('response').textContent =
            JSON.stringify(data, null, 2);
    });
</script>

</body>
</html>
