<!DOCTYPE html>
<html>
<head>
    <title>Dynamic User Form</title>
    <style>
        .address-box {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<h2>Create User</h2>

<form id="userForm" enctype="multipart/form-data">

    <input type="text" name="username" placeholder="Username"><br><br>
    <input type="password" name="password" placeholder="Password"><br><br>
    <input type="email" name="email" placeholder="Email"><br><br>
    <input type="text" name="phone_number" placeholder="Phone"><br><br>
    <input type="text" name="gender" placeholder="Gender"><br><br>
    <input type="number" name="balance" placeholder="Balance"><br><br>
    <input type="text" name="role_id" placeholder="RoleId"><br><br>
    <input type="file" name="image"><br><br>

    <hr>

    <h3>Addresses</h3>
    <div id="addressContainer"></div>

    <button type="button" onclick="addAddress()">+ Add Address</button>

    <br><br>
    <button type="submit">Submit</button>
</form>

<pre id="response" style="background:#f4f4f4;padding:10px;margin-top:20px;"></pre>

<script>
    let addressIndex = 0;
    
    function addAddress() {
      const container = document.getElementById("addressContainer");
    
      const html = `
        <div class="address-box">
          <input name="address[${addressIndex}].village_id" placeholder="Village ID"><br>
          <input name="address[${addressIndex}].street"    placeholder="Street / Alamat Lengkap"><br>
          <button type="button" onclick="this.parentElement.remove()">Remove</button>
        </div>
      `;
    
      container.insertAdjacentHTML("beforeend", html);
      addressIndex++;
    }
    
    document.getElementById("userForm").addEventListener("submit", async function(e) {
      e.preventDefault();
    
      const formData = new FormData(this);
    
      const res = await fetch("http://localhost:5197/api/User", {
        method: "POST",
        body: formData
      });
    
      const data = await res.json();
      document.getElementById('response').textContent = JSON.stringify(data, null, 2);
    });
</script>

</body>
</html>
