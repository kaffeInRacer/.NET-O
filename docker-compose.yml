version: '3.8'

services:
  user-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shoopers_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - shoopers_network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  administrative-mongodb:
    image: mongo:latest@sha256:a706cb4e493bcd0262f345b3b0c78732ca0e54301f0d7bbe2b66f26313ce7ccb
    container_name: shoopers_administrative_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: administrative_db
    ports:
      - "27017:27017"
    volumes:
      - administrative_mongodb_data:/data/db
    networks:
      - shoopers_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: shoopers_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - shoopers_network
    restart: unless-stopped
    command: server /data --console-address ":9001"

volumes:
  sqlserver_data:
  administrative_mongodb_data:
  minio_data:

networks:
  shoopers_network:
    driver: bridge